<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Прайс-лист САН-АЙС</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS для обработки Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Поддержка безопасных зон для iOS */
        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            -webkit-tap-highlight-color: transparent;
        }

        .fade-in {
            animation: fadeIn 0.2s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @media print {
            header, footer, .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .print-full-width { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col selection:bg-blue-500 selection:text-white">

    <!-- Шапка приложения -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs no-print">
        <div class="max-w-5xl mx-auto px-3 sm:px-6 py-2.5 sm:py-3 flex items-center justify-between gap-2">
            <!-- Логотип и заголовок -->
            <div class="flex items-center gap-2 sm:gap-3 cursor-pointer shrink-0" onclick="goBack()">
                <div class="bg-blue-600 p-2 sm:p-2.5 rounded-xl text-white shadow-sm flex items-center justify-center shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 sm:w-5 sm:h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                    </svg>
                </div>
                <div class="leading-tight">
                    <h1 class="text-sm sm:text-base font-bold text-slate-900 tracking-tight">САН-АЙС Прайс</h1>
                    <p id="cache-status" class="text-[10px] sm:text-xs text-slate-400 font-medium">Загрузка данных...</p>
                </div>
            </div>

            <!-- Валюты, Обновление и Загрузка Excel -->
            <div class="flex items-center gap-1.5 sm:gap-2">
                <!-- Переключатель валют -->
                <div class="inline-flex items-center rounded-lg bg-slate-100 p-0.5 text-xs font-bold text-slate-600 border border-slate-200">
                    <button id="curr-usd" onclick="setCurrency('USD')" class="px-2 py-1 rounded-md transition-all bg-white text-blue-600 shadow-xs">USD</button>
                    <button id="curr-uah" onclick="setCurrency('UAH')" class="px-2 py-1 rounded-md transition-all hover:text-slate-900">UAH</button>
                    <button id="curr-eur" onclick="setCurrency('EUR')" class="px-2 py-1 rounded-md transition-all hover:text-slate-900">EUR</button>
                </div>

                <!-- Кнопка синхронизации -->
                <button onclick="checkOnlinePrice(true)" title="Обновить из файла price.xlsx" class="p-2 text-slate-600 hover:text-blue-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-all border border-slate-200 active:scale-95">
                    <svg id="sync-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>

                <!-- Загрузка собственного Excel -->
                <label class="cursor-pointer p-2 text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-xs transition-all active:scale-95 flex items-center justify-center" title="Загрузить Excel файл">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    <input type="file" id="excel-file-input" accept=".xlsx, .xls" class="hidden" onchange="handleFileUpload(event)">
                </label>
            </div>
        </div>
    </header>

    <!-- Уведомления Toast -->
    <div id="toast-banner" class="hidden max-w-5xl mx-auto px-3 sm:px-6 mt-3 no-print">
        <div id="toast-content" class="bg-emerald-50 border border-emerald-200 text-emerald-800 px-3 py-2 rounded-xl flex items-center justify-between text-xs shadow-xs fade-in">
            <span id="toast-message">Данные обновлены!</span>
            <button onclick="dismissToast()" class="text-emerald-700 font-bold ml-2">✕</button>
        </div>
    </div>

    <!-- Основной контент -->
    <main class="flex-grow max-w-5xl mx-auto w-full px-3 sm:px-6 py-4 print-full-width">
        
        <!-- ЭКРАН 1: Сетка категорий (Строго 5 плиток) -->
        <div id="tiles-view" class="fade-in">
            <div class="flex items-center justify-between gap-2 mb-4">
                <div>
                    <h2 class="text-lg sm:text-xl font-bold text-slate-900 tracking-tight">Категории оборудования</h2>
                </div>
                <span id="categories-count" class="text-xs font-bold px-2.5 py-1 bg-slate-200/80 text-slate-700 rounded-lg">5 вкладок</span>
            </div>
            
            <!-- Плитки категорий -->
            <div class="grid grid-cols-2 gap-3 sm:gap-4 md:gap-5" id="tiles-container">
                <!-- Генерация 5 плиток через JS -->
            </div>
        </div>

        <!-- ЭКРАН 2: Таблица маркировок и цен -->
        <div id="table-view" class="hidden flex-col gap-4 fade-in">
            <!-- Верхняя панель -->
            <div class="flex flex-col sm:flex-row gap-2.5 justify-between items-stretch sm:items-center no-print">
                <button onclick="goBack()" class="flex items-center justify-center gap-1.5 text-xs font-bold text-slate-700 bg-white border border-slate-200 py-2.5 px-3.5 rounded-xl shadow-xs active:scale-95 transition-all hover:bg-slate-50">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3.5 h-3.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                    </svg>
                    Все категории
                </button>

                <div class="relative w-full sm:w-72">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" id="search-input" onkeyup="filterTable()" class="block w-full p-2.5 pl-9 text-xs sm:text-sm text-slate-900 bg-white rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 shadow-xs outline-none" placeholder="Поиск маркировки...">
                </div>
            </div>

            <!-- Шапка выбранной категории -->
            <div class="flex items-center gap-3 bg-white p-3.5 sm:p-4 rounded-xl border border-slate-200 shadow-xs">
                <div id="category-icon" class="p-2.5 rounded-lg text-white shadow-xs bg-blue-600 shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                </div>
                <div class="overflow-hidden">
                    <h2 id="category-title" class="text-base sm:text-lg font-bold text-slate-900 truncate">Категория</h2>
                    <p id="category-stats" class="text-[11px] sm:text-xs text-slate-400 font-medium">0 моделей</p>
                </div>
            </div>

            <!-- Таблица с ЧИСТО Маркировкой и Ценой -->
            <div id="tables-container" class="space-y-4">
                <!-- Таблица создается JS -->
            </div>

            <!-- Пустое состояние -->
            <div id="empty-state" class="hidden flex-col items-center justify-center p-8 bg-white border border-slate-200 rounded-xl text-slate-400">
                <p class="text-sm font-semibold text-slate-600">Маркировка не найдена</p>
                <p class="text-xs mt-0.5">Попробуйте ввести другие символы</p>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 mt-auto no-print">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between text-[11px] text-slate-400">
            <div>&copy; 2026 САН-АЙС Прайс</div>
            <div class="flex items-center gap-1 font-medium text-emerald-600">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Готово
            </div>
        </div>
    </footer>

    <script>
        const CACHE_KEY = 'san_ice_price_exact5_v4';
        const ONLINE_FILE_PATH = './price.xlsx';

        const EXCHANGE_RATES = { USD: 1.0, UAH: 41.5, EUR: 0.92 };
        const CURRENCY_SYMBOLS = { USD: '$', UAH: 'грн', EUR: '€' };

        // СТРОГО 5 разрешенных категорий из прайса
        const CATEGORY_CONFIGS = [
            { id: 'побутові', title: 'Побутові', color: 'bg-gradient-to-br from-blue-600 to-cyan-500' },
            { id: 'мультисистеми', title: 'Мультисистеми', color: 'bg-gradient-to-br from-indigo-600 to-violet-500' },
            { id: 'напівпром', title: 'Напівпром', color: 'bg-gradient-to-br from-emerald-600 to-teal-500' },
            { id: 'galactic', title: 'Galactic', color: 'bg-gradient-to-br from-amber-500 to-orange-500' },
            { id: 'galactic lcac', title: 'Galactic LCAC', color: 'bg-gradient-to-br from-rose-600 to-pink-500' }
        ];

        let categoriesData = [];
        let currentCategoryIndex = null;
        let selectedCurrency = 'USD';

        document.addEventListener('DOMContentLoaded', () => {
            initApp();
        });

        function initApp() {
            const cached = localStorage.getItem(CACHE_KEY);
            if (cached) {
                try {
                    const parsed = JSON.parse(cached);
                    categoriesData = parsed.data || [];
                    if (categoriesData.length === 0) loadFallbackData();
                    else renderTiles();
                    updateStatus(`Кэш от: ${parsed.timestamp}`);
                } catch (e) {
                    loadFallbackData();
                }
            } else {
                loadFallbackData();
            }

            checkOnlinePrice(false);
        }

        async function checkOnlinePrice(isManual = false) {
            const syncIcon = document.getElementById('sync-icon');
            if (isManual && syncIcon) syncIcon.classList.add('animate-spin');

            try {
                const response = await fetch(ONLINE_FILE_PATH + '?t=' + new Date().getTime(), { cache: 'no-cache' });
                if (!response.ok) {
                    if (isManual) showCustomToast('Файл price.xlsx не найден', 'warning');
                    return;
                }

                const arrayBuffer = await response.arrayBuffer();
                const newCategories = parseExcelArrayBuffer(arrayBuffer);

                if (newCategories && newCategories.length > 0) {
                    const timestamp = new Date().toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
                    localStorage.setItem(CACHE_KEY, JSON.stringify({ timestamp, data: newCategories }));
                    categoriesData = newCategories;
                    renderTiles();
                    if (currentCategoryIndex !== null) openCategory(currentCategoryIndex);
                    updateStatus(`Обновлено: ${timestamp}`);
                    if (isManual) showCustomToast('Прайс успешно обновлен!', 'success');
                }
            } catch (err) {
                if (isManual) showCustomToast('Ошибка обновления файла', 'error');
            } finally {
                if (syncIcon) syncIcon.classList.remove('animate-spin');
            }
        }

        // Определение, к какой из 5 категорий относится лист Excel
        function getCanonicalCategoryKey(sheetName) {
            if (!sheetName || typeof sheetName !== 'string') return null;
            const norm = sheetName.trim().toLowerCase();
            
            if (norm.includes('побутові') || norm.includes('побытовые')) {
                return 'побутові';
            }
            if (norm.includes('мультисистеми') || norm.includes('мультисистемы')) {
                return 'мультисистеми';
            }
            if (norm.includes('напівпром') || norm.includes('полупром')) {
                return 'напівпром';
            }
            // Проверка Galactic LCAC ДО Galactic
            if (norm.includes('galactic lcac') || norm.includes('galactic-lcac') || norm.includes('lcac')) {
                return 'galactic lcac';
            }
            // Строго точное совпадение для Galactic, чтобы отсеять VRF, ККБ, TH, REMAK
            if (norm === 'galactic') {
                return 'galactic';
            }
            
            return null; // Все остальные вкладки жестко отсекаются
        }

        // Проверка: является ли строка НАСТОЯЩЕЙ маркировкой кондиционера
        function isValidModelCode(str) {
            if (!str || typeof str !== 'string') return false;
            const s = str.trim();
            if (s.length < 3 || s.length > 50) return false;

            // Исключаем скобки с диапазоном мощности вроде (1,0 - 6,3) или (0.9-2.8)
            if (/\(\s*\d+[\d\.,]*\s*[-–—]\s*\d+[\d\.,]*\s*\)/.test(s)) return false;

            const lower = s.toLowerCase();

            // Запрещенные слова и заголовки
            const forbidden = [
                'підключення', 'настінний', 'касетний', 'стельовий', 'канальний',
                'модель', 'тип', 'найменування', 'продуктивність', 'споживана',
                'потужність', 'коефіцієнт', 'ціна', 'дилер', 'аксесуари',
                'внутрішній', 'зовнішній', 'панель', 'пульт', 'комплект', 'інвертор',
                'спліт', 'система', 'холод', 'тепло', 'серія', 'моделі', 'примітка',
                'аксессуары', 'наименование', 'руб', 'грн', 'usd', 'eur', 'lcac'
            ];

            for (const word of forbidden) {
                if (lower.includes(word)) return false;
            }

            // Маркировка должна соответствовать паттерну артикула
            const modelPattern = /^[A-Z]{2,6}[0-9]{1,3}[A-Z0-9\-\(\)\/]*$/i;
            const cleanStr = s.replace(/\s+/g, '');
            if (modelPattern.test(cleanStr)) return true;

            // Сдвоенные модели
            if (s.includes('+')) {
                const parts = s.split('+').map(p => p.trim());
                return parts.length === 2 && parts.every(p => modelPattern.test(p.replace(/\s+/g, '')));
            }

            return false;
        }

        function sanitizeModelName(str) {
            if (!str) return '';
            let cleaned = str.trim();
            cleaned = cleaned.replace(/\(внутр\.\s*\+\s*пульт.*?\)/gi, '');
            cleaned = cleaned.replace(/\(зовніш\..*?\)/gi, '');
            cleaned = cleaned.replace(/внутр\.?\s*|\s*зовніш\.?/gi, '');
            cleaned = cleaned.replace(/панель.*$/gi, '');
            cleaned = cleaned.replace(/"[^"]*"/g, '');
            return cleaned.trim();
        }

        function extractPriceFromRow(cells) {
            const numericCandidates = [];
            
            for (let i = 0; i < cells.length; i++) {
                const raw = cells[i];
                if (!raw) continue;
                const cleaned = String(raw).replace(/\s/g, '').replace(',', '.');
                const num = parseFloat(cleaned);
                
                if (!isNaN(num) && isFinite(num) && num > 0) {
                    numericCandidates.push({ val: num, raw: String(raw).trim(), colIdx: i });
                } else if (cleaned.toLowerCase().includes('зазапитом') || cleaned.toLowerCase().includes('запросом')) {
                    return 'За запитом';
                }
            }

            if (numericCandidates.length === 0) return null;

            // Цены обычно находятся в крайних правых колонках (colIdx >= 5)
            const priceCandidates = numericCandidates.filter(c => c.colIdx >= 5 && c.val >= 50);

            if (priceCandidates.length === 0) {
                return numericCandidates[numericCandidates.length - 1].raw;
            }

            return priceCandidates[priceCandidates.length - 1].raw;
        }

        // Парсинг файла Excel строго для 5 категорий с учетом структуры LCAC
        function parseExcelArrayBuffer(buffer) {
            const workbook = XLSX.read(buffer, { type: 'array' });
            
            const canonicalMap = {
                'побутові': { id: 'побутові', title: 'Побутові', colorClass: CATEGORY_CONFIGS[0].color, items: [] },
                'мультисистеми': { id: 'мультисистеми', title: 'Мультисистеми', colorClass: CATEGORY_CONFIGS[1].color, items: [] },
                'напівпром': { id: 'напівпром', title: 'Напівпром', colorClass: CATEGORY_CONFIGS[2].color, items: [] },
                'galactic': { id: 'galactic', title: 'Galactic', colorClass: CATEGORY_CONFIGS[3].color, items: [] },
                'galactic lcac': { id: 'galactic lcac', title: 'Galactic LCAC', colorClass: CATEGORY_CONFIGS[4].color, items: [] }
            };

            workbook.SheetNames.forEach((sheetName) => {
                const catKey = getCanonicalCategoryKey(sheetName);
                if (!catKey) return;

                const worksheet = workbook.Sheets[sheetName];
                const rawRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                if (!rawRows || rawRows.length === 0) return;

                const category = canonicalMap[catKey];
                let lastValidPrice = null;

                rawRows.forEach((row) => {
                    if (!Array.isArray(row)) return;
                    const cells = row.map(cell => String(cell).trim());
                    if (cells.every(c => c === '')) return;

                    // Проверяем цену в текущей строке
                    const rowPrice = extractPriceFromRow(cells);
                    if (rowPrice && rowPrice !== 'За запитом') {
                        lastValidPrice = rowPrice;
                    }

                    if (catKey === 'напівпром' || catKey === 'galactic lcac') {
                        // Для LCAC и Напівпром главная маркировка комплекта идет в первой колонке (индекс 0)
                        let modelCandidate = cells[0];
                        
                        if (isValidModelCode(modelCandidate)) {
                            const cleanModel = sanitizeModelName(modelCandidate);
                            const priceToUse = rowPrice || lastValidPrice;
                            
                            if (priceToUse && cleanModel) {
                                if (!category.items.some(it => it.model === cleanModel)) {
                                    category.items.push({ model: cleanModel, basePrice: priceToUse });
                                }
                            }
                        }
                    } else {
                        let modelCandidate = cells[0];
                        if (!isValidModelCode(modelCandidate) && cells[1] && isValidModelCode(cells[1])) {
                            modelCandidate = cells[1];
                        }

                        if (isValidModelCode(modelCandidate)) {
                            const cleanModel = sanitizeModelName(modelCandidate);
                            const price = rowPrice || lastValidPrice;
                            if (price && cleanModel) {
                                if (!category.items.some(it => it.model === cleanModel)) {
                                    category.items.push({ model: cleanModel, basePrice: price });
                                }
                            }
                        }
                    }
                });
            });

            return Object.values(canonicalMap).filter(cat => cat.items.length > 0);
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const parsed = parseExcelArrayBuffer(data);

                    if (parsed && parsed.length > 0) {
                        categoriesData = parsed;
                        localStorage.setItem(CACHE_KEY, JSON.stringify({ timestamp: 'Из файла', data: categoriesData }));
                        renderTiles();
                        updateStatus(`Загружен: ${file.name}`);
                        showCustomToast('Прайс-лист успешно обновлен!', 'success');
                    } else {
                        showCustomToast('Не удалось извлечь данные из 5 вкладок', 'error');
                    }
                } catch (err) {
                    showCustomToast('Ошибка при чтении Excel', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // Отрисовка СТРОГО 5 плиток категорий
        function renderTiles() {
            const container = document.getElementById('tiles-container');
            const countBadge = document.getElementById('categories-count');
            container.innerHTML = '';

            countBadge.innerText = `${categoriesData.length} вкладок`;

            if (categoriesData.length === 0) {
                container.innerHTML = `
                    <div class="col-span-2 bg-white p-6 rounded-xl border border-slate-200 text-center text-slate-500 shadow-xs">
                        <p class="font-bold text-slate-700 text-sm">Данные прайса не загружены</p>
                        <p class="text-xs mt-1 text-slate-400">Загрузите файл price.xlsx</p>
                    </div>
                `;
                return;
            }

            categoriesData.forEach((category, idx) => {
                const itemCount = category.items.length;
                const tile = document.createElement('div');
                tile.className = `group relative overflow-hidden rounded-xl shadow-xs hover:shadow-md transition-all duration-200 active:scale-98 cursor-pointer bg-white border border-slate-200 flex flex-col justify-between h-36 sm:h-40`;
                tile.onclick = () => openCategory(idx);

                tile.innerHTML = `
                    <div class="${category.colorClass} h-20 sm:h-24 p-3 sm:p-4 flex flex-col justify-between relative overflow-hidden">
                        <span class="self-end bg-white/20 backdrop-blur-md text-white text-[10px] sm:text-xs px-2 py-0.5 rounded-md font-bold">
                            ${itemCount} шт
                        </span>
                        <div class="text-white font-bold text-sm sm:text-base leading-tight drop-shadow-xs">
                            ${category.title}
                        </div>
                    </div>
                    <div class="p-3 bg-white flex items-center justify-between">
                        <span class="text-[11px] sm:text-xs font-semibold text-blue-600 group-hover:text-blue-700">Открыть</span>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3.5 h-3.5 text-blue-600 group-hover:translate-x-0.5 transition-transform">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                        </svg>
                    </div>
                `;
                container.appendChild(tile);
            });
        }

        function openCategory(index) {
            currentCategoryIndex = index;
            const category = categoriesData[index];

            document.getElementById('category-title').innerText = category.title;
            document.getElementById('category-stats').innerText = `Всего позиций: ${category.items.length}`;

            const iconContainer = document.getElementById('category-icon');
            iconContainer.className = `p-2.5 rounded-lg text-white shadow-xs ${category.colorClass}`;

            document.getElementById('search-input').value = '';
            renderTables(category.items);

            document.getElementById('tiles-view').classList.add('hidden');
            document.getElementById('table-view').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goBack() {
            currentCategoryIndex = null;
            document.getElementById('table-view').classList.add('hidden');
            document.getElementById('tiles-view').classList.remove('hidden');
        }

        // Чистая отрисовка таблицы: Маркировка — Цена
        function renderTables(items) {
            const container = document.getElementById('tables-container');
            const emptyState = document.getElementById('empty-state');
            container.innerHTML = '';

            if (!items || items.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
            }

            const wrapper = document.createElement('div');
            wrapper.className = 'bg-white border border-slate-200 rounded-xl shadow-xs overflow-hidden';

            const rowsHtml = items.map((item) => {
                let displayPrice = item.basePrice;
                const num = parseFloat(String(item.basePrice).replace(/\s/g, '').replace(',', '.'));
                
                if (!isNaN(num) && isFinite(num)) {
                    const converted = num * EXCHANGE_RATES[selectedCurrency];
                    displayPrice = converted.toLocaleString('ru-RU', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' ' + CURRENCY_SYMBOLS[selectedCurrency];
                }

                return `
                    <tr class="hover:bg-slate-50 transition-colors border-b border-slate-100 last:border-b-0">
                        <td class="px-3.5 sm:px-5 py-3 font-semibold text-slate-800 text-xs sm:text-sm break-all">
                            ${item.model}
                        </td>
                        <td class="px-3.5 sm:px-5 py-3 text-right whitespace-nowrap">
                            <span class="inline-block px-2.5 py-1 bg-emerald-50 text-emerald-700 font-bold rounded-lg border border-emerald-100 text-xs sm:text-sm">
                                ${displayPrice}
                            </span>
                        </td>
                    </tr>
                `;
            }).join('');

            wrapper.innerHTML = `
                <div class="overflow-x-auto no-scrollbar">
                    <table class="w-full text-left">
                        <thead class="text-[10px] sm:text-xs text-slate-400 uppercase bg-slate-50 border-b border-slate-200">
                            <tr>
                                <th scope="col" class="px-3.5 sm:px-5 py-2.5 font-bold">Маркировка</th>
                                <th scope="col" class="px-3.5 sm:px-5 py-2.5 font-bold text-right">Цена (${selectedCurrency})</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            ${rowsHtml}
                        </tbody>
                    </table>
                </div>
            `;

            container.appendChild(wrapper);
        }

        function filterTable() {
            if (currentCategoryIndex === null) return;
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const originalItems = categoriesData[currentCategoryIndex].items;

            if (!query) {
                renderTables(originalItems);
                return;
            }

            const filtered = originalItems.filter(item => {
                return item.model && item.model.toLowerCase().includes(query);
            });

            renderTables(filtered);
        }

        function setCurrency(curr) {
            selectedCurrency = curr;
            ['usd', 'uah', 'eur'].forEach(c => {
                const btn = document.getElementById(`curr-${c}`);
                if (c.toUpperCase() === curr) {
                    btn.className = "px-2 py-1 rounded-md transition-all bg-white text-blue-600 shadow-xs";
                } else {
                    btn.className = "px-2 py-1 rounded-md transition-all hover:text-slate-900";
                }
            });

            if (currentCategoryIndex !== null) {
                renderTables(categoriesData[currentCategoryIndex].items);
            }
        }

        function updateStatus(text) {
            document.getElementById('cache-status').innerText = text;
        }

        function showCustomToast(msg, type = 'success') {
            const toast = document.getElementById('toast-banner');
            const toastContent = document.getElementById('toast-content');
            const toastMsg = document.getElementById('toast-message');

            toastMsg.innerText = msg;
            if (type === 'error') {
                toastContent.className = 'bg-rose-50 border border-rose-200 text-rose-800 px-3 py-2 rounded-xl flex items-center justify-between text-xs shadow-xs fade-in';
            } else if (type === 'warning') {
                toastContent.className = 'bg-amber-50 border border-amber-200 text-amber-800 px-3 py-2 rounded-xl flex items-center justify-between text-xs shadow-xs fade-in';
            } else {
                toastContent.className = 'bg-emerald-50 border border-emerald-200 text-emerald-800 px-3 py-2 rounded-xl flex items-center justify-between text-xs shadow-xs fade-in';
            }

            toast.classList.remove('hidden');
            setTimeout(() => dismissToast(), 3000);
        }

        function dismissToast() {
            document.getElementById('toast-banner').classList.add('hidden');
        }
